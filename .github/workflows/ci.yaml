name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Determine validation scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.scope.outputs.run_checks }}
    steps:
      - uses: actions/checkout@v6
      - name: Classify the complete pull request
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          run_checks=true
          # Pushes and manual runs always validate. Only an explicit docs-only
          # PR may skip expensive work; unknown paths and empty diffs validate.
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
            if [[ -s "$RUNNER_TEMP/changed-files" ]]; then
              run_checks=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  README.md|AGENTS.md|docs/*.md) ;;
                  *) run_checks=true; break ;;
                esac
              done < "$RUNNER_TEMP/changed-files"
            fi
          fi
          echo "run_checks=$run_checks" >> "$GITHUB_OUTPUT"

  symfony:
    name: Symfony / PHP 8.5
    needs: changes
    # Required checks must remain present, even for docs-only PRs or a failed
    # classifier. A failed classifier must fail these checks, never skip them.
    # Superseded runs must still cancel their expensive work.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: test
      PANTHER_APP_ENV: test
      PANTHER_ERROR_SCREENSHOT_DIR: ./var/error-screenshots
    steps:
      - name: Require a valid scope decision
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run_checks }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$RUN_CHECKS" in
            true) ;;
            false) echo 'Application checks skipped: every changed path is documentation.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@v6
        if: needs.changes.outputs.run_checks == 'true'
      - name: Install the locked Devbox environment
        if: needs.changes.outputs.run_checks == 'true'
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: '0.18.4'
          enable-cache: 'true'
      - name: Allow the installed Chromium namespace sandbox
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          devbox run -- scripts/configure-chromium-sandbox --install
          # A second invocation must safely update the managed profile.
          devbox run -- scripts/configure-chromium-sandbox --install
          if [[ $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true) == 1 ]]; then
            profile_probe=/etc/apparmor.d/chess-dog-unmanaged-ci-probe
            test ! -e "$profile_probe"
            trap 'sudo rm -f -- "$profile_probe"' EXIT
            printf '# Unmanaged CI profile probe\n' | sudo tee "$profile_probe" >/dev/null
            if devbox run -- scripts/configure-chromium-sandbox --install --profile-name chess-dog-unmanaged-ci-probe > "$RUNNER_TEMP/profile-probe.log" 2>&1; then
              echo 'An unmanaged AppArmor profile was accepted for replacement.' >&2
              exit 1
            fi
            grep -F 'Refusing to overwrite unmanaged AppArmor profile:' "$RUNNER_TEMP/profile-probe.log"
            test "$(cat "$profile_probe")" = '# Unmanaged CI profile probe'
          fi
      - name: Verify development tools and child runtimes
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          devbox run -- check --headless
          devbox run -- setup --help | grep -F 'Usage: scripts/setup'
      - name: Locate Composer download cache
        if: needs.changes.outputs.run_checks == 'true'
        id: composer-cache
        run: echo "dir=$(devbox run -- composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        if: needs.changes.outputs.run_checks == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ runner.arch }}-php85-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-php85-composer-
      - name: Install locked dependencies
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          devbox run -- composer validate --strict
          devbox run -- setup --env test --skip-assets -- --prefer-dist --no-interaction --no-progress
      - name: Validate PHP, Symfony configuration, and templates
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          devbox run -- bash -euo pipefail -c 'git ls-files -z -- "*.php" bin/console | xargs -0 -r -n 1 php -l'
          devbox run -- php bin/console lint:yaml config --parse-tags
          devbox run -- php bin/console lint:twig templates
          devbox run -- php bin/console lint:container --resolve-env-vars
      - name: Cache the pinned Tailwind executable
        if: needs.changes.outputs.run_checks == 'true'
        uses: actions/cache@v6
        with:
          # Do not restore built CSS: every run compiles the current sources.
          path: var/tailwind/v*/tailwindcss-*
          key: ${{ runner.os }}-${{ runner.arch }}-tailwind-${{ hashFiles('composer.lock', 'config/packages/symfonycasts_tailwind.yaml') }}
      - name: Compile browser assets
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          devbox run -- php bin/console tailwind:build --minify
          devbox run -- php bin/console asset-map:compile
      - name: Run application and browser tests
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          devbox run test --log-junit var/test-results.xml
          test -s var/test-results.xml
      - name: Verify package locks remain unchanged
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          git ls-files --error-unmatch devbox.lock
          git diff --exit-code -- devbox.json devbox.lock composer.lock
      - name: Upload test failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: symfony-test-failures
          path: |
            var/error-screenshots/
            var/log/test.log
            var/test-results.xml
            devbox.lock
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker / ${{ matrix.name }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: development
            target: frankenphp_dev
            image: dev
          - name: production
            target: frankenphp_prod
            image: prod
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      COMPOSE_PROJECT_NAME: chess-dog-ci
      HTTP_PORT: '8080'
      HTTPS_PORT: '8443'
      HTTP3_PORT: '8443'
      APP_SECRET: ci-smoke-secret
      CADDY_MERCURE_JWT_SECRET: ci-only-unused-mercure-key
    steps:
      - name: Require a valid scope decision
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run_checks }}
        run: |
          test "$SCOPE_RESULT" = success
          case "$RUN_CHECKS" in
            true) ;;
            false) echo 'Docker checks skipped: every changed path is documentation.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@v6
        if: needs.changes.outputs.run_checks == 'true'
      - uses: docker/setup-buildx-action@v4
        if: needs.changes.outputs.run_checks == 'true'
      - name: Match development containers to the checkout owner
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build Docker image
        if: needs.changes.outputs.run_checks == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: app-php-${{ matrix.image }}
          build-args: |
            LOCAL_UID=${{ env.LOCAL_UID }}
            LOCAL_GID=${{ env.LOCAL_GID }}
          # Content-addressed layers also reuse the shared PHP base stage from
          # the other target, without restoring stale application outputs.
          cache-from: |
            type=gha,scope=frankenphp_dev
            type=gha,scope=frankenphp_prod
          # Cache export is optional; image-build failures still fail the job.
          # Fork PRs can read branch caches but need not upload cache blobs.
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.target) || '' }}
      - name: Configure Compose smoke environment
        if: needs.changes.outputs.run_checks == 'true'
        env:
          IMAGE_MODE: ${{ matrix.name }}
        run: |
          cat > "$RUNNER_TEMP/chess-dog-ci.yaml" <<'YAML'
          services:
            php:
              environment:
                APP_SECRET: 'ci-smoke-secret'
          YAML
          mode_file=compose.prod.yaml
          if [[ "$IMAGE_MODE" == development ]]; then
            mode_file=compose.override.yaml
          fi
          echo "COMPOSE_FILE=compose.yaml:$mode_file:$RUNNER_TEMP/chess-dog-ci.yaml" >> "$GITHUB_ENV"
      - name: Verify Compose storage and Mercure subscriber credentials
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          docker compose -f compose.yaml -f compose.override.yaml config --format json > "$RUNNER_TEMP/compose-dev.json"
          docker compose -f compose.yaml -f compose.prod.yaml config --format json > "$RUNNER_TEMP/compose-prod.json"
          python3 - "$RUNNER_TEMP/compose-dev.json" "$RUNNER_TEMP/compose-prod.json" <<'PY'
          import json
          import sys

          storage = []
          for filename in sys.argv[1:]:
              with open(filename) as source:
                  config = json.load(source)
              environment = config['services']['php']['environment']
              expected_secret = 'ci-only-unused-mercure-key'
              assert environment['MERCURE_SUBSCRIBER_JWT_KEY'] == expected_secret, 'Hub subscriber key is not configured'
              assert environment['MERCURE_SUBSCRIBER_JWT_SECRET'] == expected_secret, 'Application subscriber key differs from the hub'
              names = set()
              for target in ('/data', '/config'):
                  mounts = [mount for mount in config['services']['php']['volumes'] if mount['target'] == target]
                  assert len(mounts) == 1 and mounts[0]['type'] == 'volume', f'Expected one named volume at {target}'
                  names.add(config['volumes'][mounts[0]['source']]['name'])
              assert len(names) == 2, 'Caddy data and config must use separate volumes'
              storage.append(names)
          assert storage[0].isdisjoint(storage[1]), 'Development and production must not share Caddy storage'
          print('Compose modes isolate Caddy volumes and share one Mercure subscriber key.')
          PY
      - name: Seed retained development storage with legacy root ownership
        if: needs.changes.outputs.run_checks == 'true' && matrix.name == 'development'
        run: |
          docker compose run --rm --no-deps --user root --entrypoint sh caddy-storage -euc '
            mkdir -p /data/caddy /config/caddy
            printf retained > /data/caddy/ownership-regression
            chown -R root:root /data/caddy /config/caddy
            chmod 700 /data/caddy /config/caddy
          '
      - name: Start Compose application and wait for health checks
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          docker compose config --quiet
          docker compose up --no-build --wait --wait-timeout 120
      - name: Verify HTTP redirects to the published HTTPS port
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          for method in GET POST; do
            # Exercise URL authorities over the same connection, without relying
            # on the runner or Docker bridge having IPv6 networking enabled.
            for host in localhost 127.0.0.1 '[::1]' '[2001:db8::42]' '[::ffff:192.0.2.1]'; do
              for source_port in '' ":$HTTP_PORT"; do
                authority="$host$source_port"
                redirect=$(curl --fail --silent --show-error --request "$method" --header "Host: $authority" --output /dev/null --write-out '%{http_code} %{redirect_url}' "http://localhost:$HTTP_PORT/foundation?provider=lichess&player=xor%20test")
                expected="308 https://$host:$HTTPS_PORT/foundation?provider=lichess&player=xor%20test"
                if [[ "$redirect" != "$expected" ]]; then
                  printf 'Unexpected %s redirect for %s: %s (expected %s)\n' "$method" "$authority" "$redirect" "$expected" >&2
                  exit 1
                fi
              done
            done
          done
      - name: Verify development Mate capabilities
        if: needs.changes.outputs.run_checks == 'true' && matrix.name == 'development'
        run: |
          docker compose exec -T php vendor/bin/mate tools:list --format=json > "$RUNNER_TEMP/mate-tools.json"
          docker compose exec -T php vendor/bin/mate tools:call server-info --format=json > "$RUNNER_TEMP/mate-runtime.json"
          docker compose exec -T php vendor/bin/mate tools:call symfony-services --context=docker --query='App\Twig\Components\ArchivePreview' --limit=5 --format=json > "$RUNNER_TEMP/mate-services.json"
          python3 - "$RUNNER_TEMP/mate-tools.json" "$RUNNER_TEMP/mate-runtime.json" "$RUNNER_TEMP/mate-services.json" <<'PY'
          import json
          import sys

          results = []
          for filename in sys.argv[1:]:
              with open(filename) as source:
                  results.append(json.load(source))
          tools, runtime, services = results
          assert {'server-info', 'symfony-services', 'symfony-service-detail'} <= tools['tools'].keys()
          assert runtime['php_version'].startswith('8.5.')
          assert r'App\Twig\Components\ArchivePreview' in services['untrusted_data']['docker']['services']
          print('Mate reports PHP 8.5 and discovers the application component service.')
          PY
      - name: Verify production excludes development Mate files
        if: needs.changes.outputs.run_checks == 'true' && matrix.name == 'production'
        run: |
          docker compose exec -T php sh -eu -c '
            for path in vendor/bin/mate mate .agents .claude; do
              test ! -e "/app/$path"
              test ! -L "/app/$path"
            done
          '
      - name: Check rendered pages and styles over trusted HTTPS
        if: needs.changes.outputs.run_checks == 'true'
        run: |
          docker compose cp php:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
          curl --cacert "$RUNNER_TEMP/caddy-root.crt" --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 --output /tmp/chess-dog-home.html https://localhost:8443/
          grep --quiet --fixed-strings 'Your chess archive,' /tmp/chess-dog-home.html
          grep --quiet --fixed-strings 'within reach.' /tmp/chess-dog-home.html
          curl --cacert "$RUNNER_TEMP/caddy-root.crt" --fail --silent --show-error --output /tmp/chess-dog-foundation.html https://localhost:8443/foundation
          grep --quiet --fixed-strings 'A foundation you can inspect.' /tmp/chess-dog-foundation.html
          css_path=$(sed -nE 's|.*href="(/assets/styles/app-[[:alnum:]_-]+\.css)".*|\1|p' /tmp/chess-dog-home.html | head -1)
          test -n "$css_path"
          curl --cacert "$RUNNER_TEMP/caddy-root.crt" --fail --silent --show-error "https://localhost:8443$css_path" --output /tmp/chess-dog.css
          test -s /tmp/chess-dog.css
          grep --quiet --fixed-strings 'tailwindcss v4.' /tmp/chess-dog.css
      - name: Set up host PHP for shared development checks
        if: needs.changes.outputs.run_checks == 'true' && matrix.name == 'development'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, pdo_sqlite, zip
          tools: composer:v2
          coverage: none
      - name: Verify native tooling and container storage agree
        if: needs.changes.outputs.run_checks == 'true' && matrix.name == 'development'
        run: scripts/check-shared-storage --url "https://localhost:$HTTPS_PORT" --ca-file "$RUNNER_TEMP/caddy-root.crt" --check-migration
      - name: Verify existing development user IDs
        if: needs.changes.outputs.run_checks == 'true' && matrix.name == 'development'
        run: scripts/check-dev-user 0:0 33:33
      - name: Print container logs on failure
        if: failure() && needs.changes.outputs.run_checks == 'true'
        run: docker compose logs --no-color || true
      - name: Stop application
        if: always() && needs.changes.outputs.run_checks == 'true'
        run: docker compose down --volumes --remove-orphans || true
