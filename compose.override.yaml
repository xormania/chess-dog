---
# Development environment override
x-development: &development
  image: ${IMAGES_PREFIX:-}app-php-dev
  build:
    context: .
    target: frankenphp_dev
    args:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}

services:
  caddy-storage:
    <<: *development
    # Older development containers wrote these retained volumes as root.
    # Migrate only Caddy storage; this service never mounts the source tree.
    user: root
    entrypoint: ["/bin/sh", "-euc"]
    command:
      - |
        mkdir -p /data/caddy /config/caddy
        chown -R "$$(id -u nonroot):$$(id -g nonroot)" /data/caddy /config/caddy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      disable: true
  php:
    <<: *development
    depends_on:
      caddy-storage:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # var/ and vendor/ remain visible to native tools through the project mount.
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
      APP_CACHE_DIR: /app/var/cache/docker
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
  tailwind:
    <<: *development
    restart: unless-stopped
    command: ["php", "bin/console", "tailwind:build", "--watch"]
    depends_on:
      php:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_CACHE_DIR: /app/var/cache/docker
      XDEBUG_MODE: "off"
    volumes:
      - ./:/app
      # PHP, the watcher and host tools all see the same local var/ directory.
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/var/tailwind/app.built.css"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    tty: true

